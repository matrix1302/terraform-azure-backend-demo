
name: Terraform Drift Detection

on:
  workflow_dispatch:

  schedule:
    - cron: '17 5 * * *'


permissions:
  contents: read
  id-token: write



jobs:
  drift-detection:
    name: Check Production Drift
    runs-on: ubuntu-latest
    environment: production-monitoring

    env:
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="backend/prod.hcl" \
            -reconfigure \
            -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Detect Configuration Drift
        id: drift
        shell: bash
        run: |
          set +e

          terraform plan \
            -var-file="environments/prod.tfvars" \
            -detailed-exitcode \
            -no-color \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          case "$exit_code" in
            0)
              echo "No Terraform changes detected."
              ;;
            1)
              echo "Terraform plan failed."
              exit 1
              ;;
            2)
              echo "Terraform changes detected."
              ;;
            *)
              echo "Unexpected Terraform exit code: $exit_code"
              exit 1
              ;;
          esac

      - name: Report Drift Detection Result
        if: always()
        shell: bash
        run: |
          case "${{ steps.drift.outputs.exit_code }}" in
            0)
              echo "### Terraform Drift Detection: No Changes" >> "$GITHUB_STEP_SUMMARY"
              echo "Production infrastructure matches the Terraform configuration." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "### Terraform Drift Detection: Changes Detected" >> "$GITHUB_STEP_SUMMARY"
              echo "Terraform detected differences requiring review." >> "$GITHUB_STEP_SUMMARY"
              echo "Check the execution log for details." >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "### Terraform Drift Detection: Failed" >> "$GITHUB_STEP_SUMMARY"
              echo "Terraform plan encountered an error." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "### Terraform Drift Detection: Incomplete" >> "$GITHUB_STEP_SUMMARY"
              echo "Check the workflow logs for initialization or validation errors." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac


      - name: Authenticate to Microsoft Entra ID for Graph notifications
        if: steps.drift.outputs.exit_code == '2'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.GRAPH_CLIENT_ID }}
          tenant-id: ${{ vars.GRAPH_TENANT_ID }}
          allow-no-subscriptions: true


      - name: Obtain Microsoft Graph Access Token
        if: steps.drift.outputs.exit_code == '2'
        id: graph-token
        shell: bash
        run: |
          token=$(az account get-access-token \
            --resource https://graph.microsoft.com \
            --query accessToken \
            --output tsv)

          echo "::add-mask::$token"
          echo "GRAPH_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"


      - name: Send Terraform Drift Notification
        if: steps.drift.outputs.exit_code == '2'
        shell: bash
        env:
          NOTIFICATION_SENDER: terraform-alerts@matrixpost.tech
          NOTIFICATION_RECIPIENT: ${{ vars.DRIFT_NOTIFICATION_RECIPIENT }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          sender = os.environ["NOTIFICATION_SENDER"]
          recipient = os.environ["NOTIFICATION_RECIPIENT"]

          payload = {
              "message": {
                  "subject": "Terraform Drift Detected - Production",
                  "body": {
                      "contentType": "Text",
                      "content": (
                          "Terraform detected configuration drift in production.\n\n"
                          f"Repository: {os.environ['GITHUB_REPOSITORY']}\n"
                          f"Workflow run: {os.environ['GITHUB_SERVER_URL']}/"
                          f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                          f"{os.environ['GITHUB_RUN_ID']}\n\n"
                          "Review the Terraform plan in the workflow logs."
                      )
                  },
                  "toRecipients": [
                      {"emailAddress": {"address": recipient}}
                  ]
              },
              "saveToSentItems": True
          }

          request = urllib.request.Request(
              f"https://graph.microsoft.com/v1.0/users/{sender}/sendMail",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GRAPH_ACCESS_TOKEN']}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(f"Microsoft Graph sendMail HTTP status: {response.status}")
          PY

      - name: Fail Workflow on Detected Changes
        if: steps.drift.outputs.exit_code == '2'
        run: |
          echo "Terraform detected configuration differences."
          exit 1
